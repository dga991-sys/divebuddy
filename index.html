<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DiveBuddy</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="style.css"></head><body><main><h1>🤿 DIVE<span>BUDDY</span></h1><section id="auth"><div class="card"><h2>Nurkuj razem.</h2><p>Znajdź swojego buddy.</p><button id="signupTab">Rejestracja</button><button id="loginTab">Logowanie</button><input id="name" placeholder="Imię / pseudonim"><input id="email" type="email" placeholder="E-mail"><input id="pass" type="password" placeholder="Hasło"><button id="authBtn">Zaloguj się</button><p id="msg"></p></div></section><section id="main" hidden><div class="card"><h2 id="hello"></h2><h3>Profil nurka</h3><input id="city" placeholder="Miasto"><input id="level" placeholder="Poziom P1/P2/OWD"><input id="dives" type="number" placeholder="Liczba nurkowań"><input id="depth" type="number" placeholder="Max głębokość (m)"><button id="save">Zapisz profil</button><p id="saveMsg"></p></div><div class="card"><h3>👥 Nurkowie</h3><input id="search" placeholder="Szukaj po imieniu lub mieście"><div id="list"></div></div><button id="logout">Wyloguj</button></section></main><script src="app.js"></script></body></html>
